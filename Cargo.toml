[package]
name = "tuxedo"
version = "2026.8.1-khanhtd36.3"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4.44"
crossterm = "0.29.0"
flate2 = "1.1.10"
getrandom = "0.2"
notify = "8"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30.0"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tiny_http = "0.12"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
insta = "1.47"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
